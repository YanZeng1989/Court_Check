name: Check tennis court availability

on:
  # No schedule — you trigger this yourself from the Actions tab whenever
  # you want to check ("Run workflow" button). Nothing runs automatically.
  workflow_dispatch: {}

# Prevents overlapping runs if you happen to trigger it twice in a row.
concurrency:
  group: check-court-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Write config.txt from secrets
        run: |
          cat > config.txt << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          BUILDINGS=芝公園
          DEBUG=true
          EOF

      - name: Run checker
        run: python check_court_availability.py

      - name: Upload debug artifacts (only present if something failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            log.txt
          if-no-files-found: ignore
