name: Check tennis court availability

on:
  # Triggered externally through workflow_dispatch.
  # Recommended external cadence for this 2-worker version: every 2 minutes.
  workflow_dispatch: {}

# Keep only one workflow run active at a time. Parallelism happens INSIDE
# the Python process (2 park workers), avoiding a pile-up of overlapping
# GitHub Actions runs hitting the reservation site at the same time.
concurrency:
  group: check-court-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages
        run: pip install playwright jpholiday

      - name: Get installed Playwright version
        id: pw-version
        run: echo "version=$(playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Write config.txt from secrets
        run: |
          cat > config.txt << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH=${{ secrets.WATCH }}
          WEEKEND_ALL_DAY=${{ secrets.WEEKEND_ALL_DAY }}
          DEBUG=false
          EOF

      - name: Run checker
        env:
          # Two simultaneous browsers was chosen after the 3-worker run showed
          # #week-head timeouts on multiple Ariake courts.
          PARALLEL_WORKERS: "2"
        run: python check_court_availability.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            debug_calendar_sample.png
            debug_calendar_sample.html
            log.txt
          if-no-files-found: ignore
