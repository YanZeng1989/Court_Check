name: Check tennis court availability

on:
  # No schedule inside GitHub — triggered externally (e.g. by cron-job.org
  # calling the workflow_dispatch API every 5 minutes). Also runnable
  # manually from the Actions tab any time.
  workflow_dispatch: {}

# Prevents overlapping runs if two triggers land close together. This
# matters more than ever now: two runs racing would both read the same
# next_park_state.txt and could commit conflicting/duplicate rotation
# updates.
concurrency:
  group: check-court-availability
  cancel-in-progress: false

# Needed so the "Persist rotation state" step below can push a commit
# back to this repo (next_park_state.txt).
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install playwright jpholiday

      - name: Get installed Playwright version
        id: pw-version
        run: echo "version=$(playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binary
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium (only downloads if the cache above missed)
        # --with-deps installs the OS-level libraries chromium needs; that
        # part is fast and safe to re-run every time (apt just no-ops if
        # already satisfied). The slow part — downloading and unpacking
        # the ~100MB Chromium binary itself — is what the cache above
        # skips on a hit.
        run: playwright install --with-deps chromium

      - name: Write config.txt from secrets
        run: |
          cat > config.txt << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH=${{ secrets.WATCH }}
          WEEKEND_ALL_DAY=${{ secrets.WEEKEND_ALL_DAY }}
          DEBUG=false
          EOF

      - name: Run checker
        env:
          PARALLEL_WORKERS: "3"
        run: python check_court_availability.py

      - name: Upload debug artifacts (only present if something failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            debug_calendar_sample.png
            debug_calendar_sample.html
            log.txt
          if-no-files-found: ignore
