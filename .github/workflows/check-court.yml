name: Check tennis court availability

on:
  # No schedule inside GitHub — triggered externally (e.g. by cron-job.org
  # calling the workflow_dispatch API every 5 minutes). Also runnable
  # manually from the Actions tab any time.
  workflow_dispatch: {}

# Prevents overlapping runs if two triggers land close together.
concurrency:
  group: check-court-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Write config.txt from secrets
        run: |
          cat > config.txt << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH=${{ secrets.WATCH }}
          WEEKEND_ALL_DAY=${{ secrets.WEEKEND_ALL_DAY }}
          EOF

      - name: Run checker
        run: python check_court_availability.py

      - name: Upload debug artifacts (only present if something failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            log.txt
          if-no-files-found: ignore
