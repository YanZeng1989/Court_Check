name: Check Court Availability

on:
  workflow_dispatch:

concurrency:
  group: check-court-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARALLEL_WORKERS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright jpholiday

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Verify mapping file
        run: |
          test -f facility_time_mappings.json
          python -m json.tool facility_time_mappings.json >/dev/null

      - name: Create config.txt
        shell: bash
        run: |
          cat > config.txt <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH=${{ secrets.WATCH }}
          WEEKEND_ALL_DAY=${{ secrets.WEEKEND_ALL_DAY }}
          SKIP_ON_RAIN=${{ secrets.SKIP_ON_RAIN }}
          RAIN_PROBABILITY_THRESHOLD=${{ secrets.RAIN_PROBABILITY_THRESHOLD }}
          LOG_RETENTION_DAYS=7
          STOP_ON_FIRST_FIND=false
          DEBUG=false
          HEADED=false
          EOF

      - name: Run court availability checker
        run: |
          python check_court_availability.py

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-check-output
          path: |
            log.txt
            facility_time_mappings.json
            debug_error.png
            debug_error.html
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
          retention-days: 7
