name: Check tennis court availability

on:
  schedule:
    # Runs every 30 minutes. GitHub Actions cron is UTC.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Prevents overlapping runs: if a run is still in progress when the next
# scheduled trigger fires, the new one queues up and waits instead of
# starting in parallel. Only one run can be queued behind the active one at
# a time — if several triggers pile up while one is running, only the
# newest queued run survives and the rest are dropped (this is GitHub's
# default queueing behavior for a concurrency group, not something we
# configure directly).
concurrency:
  group: check-court-availability
  cancel-in-progress: false

jobs:
  check:
    # Runs on YOUR own PC (registered as a self-hosted runner) instead of
    # GitHub's shared cloud servers — this is what gets us a normal
    # residential/office IP instead of a GitHub Actions IP that the site
    # blocks. Make sure the runner is installed as a Windows service and
    # showing "Idle" under Settings → Actions → Runners before relying on
    # the schedule.
    runs-on: self-hosted
    # Hard cap on how long a single run may take. Bumped to 15 because the
    # script itself can now sleep 5 minutes and retry once if it detects a
    # site maintenance page — 10 minutes was too tight a margin for that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Write config.txt from secrets
        shell: pwsh
        run: |
          @"
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          BUILDINGS=芝公園
          DEBUG=true
          "@ | Out-File -FilePath config.txt -Encoding utf8NoBOM

      - name: Run checker
        run: python check_court_availability.py

      - name: Upload debug artifacts (only present if something failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            log.txt
          if-no-files-found: ignore
