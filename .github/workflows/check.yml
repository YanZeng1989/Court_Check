name: Check tennis court availability

on:
  schedule:
    # 每天每 30 分钟运行一次
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # 允许你在 Actions 页面手动点击运行

concurrency:
  group: check-court-availability
  cancel-in-progress: false

jobs:
  check:
    # 核心修改：从 self-hosted 改为 GitHub 官方的 Ubuntu 云端服务器
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Write config.txt from secrets
        shell: bash # 改回官方 Linux 后，这里使用标准的 bash 终端
        run: |
          cat << 'EOF' > config.txt
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          BUILDINGS=芝公園
          DEBUG=true
          EOF
          
      - name: Run checker
        run: python check_court_availability.py

      - name: Upload debug artifacts (only present if something failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            log.txt
          if-no-files-found: ignore
