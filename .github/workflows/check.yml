name: Check tennis court availability

on:
  schedule:
    # Runs every 30 minutes. GitHub Actions cron is UTC.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Write config.txt from secrets
        run: |
          cat > config.txt << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          BUILDINGS=芝公園
          DEBUG=true
          EOF

      - name: Run checker
        run: python check_court_availability.py

      - name: Upload debug artifacts (only present if something failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_error.png
            debug_error.html
            log.txt
          if-no-files-found: ignore
